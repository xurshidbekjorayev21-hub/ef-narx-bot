# fly.toml app configuration file generated for ef-narx-bot on 2026-10-28T15:05:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ef-narx-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'
  SQLITE_PATH = '/data/ef_narx.db'
  MATCH_DB_PATH = '/data/match_finder.db'

[processes]
  app = 'python -u main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[mounts]
  source = "efnarx_data"
  destination = "/data"
